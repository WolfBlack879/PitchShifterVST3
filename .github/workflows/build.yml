name: Build VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP test
        shell: bash
        run: |
          exe=$(find build -type f \( -name DspTest -o -name DspTest.exe \) -path "*Release*" | head -1)
          "$exe"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: BassPitchShifter-VST3-${{ matrix.name }}
          path: build/BassPitchShifter_artefacts/Release/VST3/
